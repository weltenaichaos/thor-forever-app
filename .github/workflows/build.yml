name: Android CI Bionic

on:
  workflow_dispatch:
    inputs:
      setup_test_copy:
        description: 'Build the "Thor Setup Test" copy that installs next to the normal app and starts fresh'
        type: boolean
        default: false
      release:
        description: 'Build the public "Thor Forever" release APK (its own app, com.thorforever.app)'
        type: boolean
        default: false
      draft_release_tag:
        description: 'With release: also put the APK on a DRAFT GitHub release with this tag, like v0.1.0 (only the owner sees a draft)'
        type: string
        default: ''
      draft_release_target:
        description: 'Commit or branch the tag will point to when the draft is published (empty: the built commit)'
        type: string
        default: ''
  push:
    branches:
      - 4.1
permissions:
  contents: write

jobs:
  # Turnip from Mesa 26.2.3 with the shader cache on and the scheduler fix from
  # patches/, the best tested driver in the Thor Forever launcher. Cached, so it
  # only rebuilds when the Mesa version, NDK or patch changes.
  turnip:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: r27d
      MESA_REF: mesa-26.2.3
    steps:
      - uses: actions/checkout@v4

      - name: Restore driver from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: turnip-out
          key: turnip-${{ env.MESA_REF }}-${{ env.NDK_VERSION }}-cache-on-${{ hashFiles('patches/turnip-*.patch') }}

      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools flex bison ninja-build
          pip install --user meson mako pyyaml packaging pycparser

      - name: Download Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          echo "NDK=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Turnip
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q mesa
          git -C mesa fetch -q --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_REF"
          git -C mesa checkout -q FETCH_HEAD
          git -C mesa apply --verbose "$GITHUB_WORKSPACE"/patches/turnip-*.patch
          bin="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-aarch64.ini <<INI
          [binaries]
          c = '$bin/aarch64-linux-android28-clang'
          cpp = '$bin/aarch64-linux-android28-clang++'
          ar = '$bin/llvm-ar'
          strip = '$bin/llvm-strip'

          [built-in options]
          c_link_args = ['-Wl,-z,max-page-size=16384']
          cpp_link_args = ['-static-libstdc++', '-Wl,-z,max-page-size=16384']

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          INI
          cd mesa
          meson setup build --cross-file ../android-aarch64.ini \
            --wrap-mode=nofallback \
            -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl \
            -Dplatforms=android -Dandroid-stub=true -Dandroid-libbacktrace=disabled \
            -Dandroid-libperfetto=disabled -Dplatform-sdk-version=28 \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dllvm=disabled \
            -Dgles1=disabled -Dgles2=disabled -Dopengl=false -Dbuild-tests=false \
            -Dvideo-codecs= -Dbuildtype=release -Dzstd=disabled -Dexpat=disabled \
            -Dzlib=enabled -Dshader-cache=enabled
          ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so
          cd ..
          mkdir -p turnip-out
          "$bin/llvm-strip" -o turnip-out/libvulkan_freedreno.so mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so
          echo "Mesa $(git -C mesa rev-parse HEAD) ($MESA_REF), NDK $NDK_VERSION, shader cache on, patches: $(cd patches && ls turnip-*.patch)" > turnip-out/BUILD-INFO.txt

      - name: Show driver
        run: |
          cat turnip-out/BUILD-INFO.txt
          sha256sum turnip-out/libvulkan_freedreno.so

      - uses: actions/upload-artifact@v4
        with:
          name: turnip-thor
          path: turnip-out/
          if-no-files-found: error

  # The frame generation layer (framegen/README.md): GameNative's lsfg-vk-android with our
  # patches from framegen/patches/. Cached, so it only rebuilds when the base, NDK or a patch changes.
  framegen:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 27.3.13750724
      LSFG_REPO: https://github.com/GameNative/lsfg-vk-android.git
      LSFG_COMMIT: abc77c8
    steps:
      - uses: actions/checkout@v4

      - name: Restore layer from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: framegen-out
          key: framegen-${{ env.LSFG_COMMIT }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('framegen/patches/*.patch', 'framegen/thirdparty/**') }}

      - name: Build layer
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "ndk;${ANDROID_NDK_VERSION}" >/dev/null
          export ANDROID_NDK="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          git clone -q "$LSFG_REPO" lsfg
          git -C lsfg checkout -q "$LSFG_COMMIT"
          # PancakeTAS/dxbc is gone from GitHub: our copy of the pinned commit is in framegen/thirdparty.
          git -C lsfg submodule update --init --recursive thirdparty/pe-parse thirdparty/toml11 thirdparty/volk
          rm -rf lsfg/thirdparty/dxbc
          cp -r framegen/thirdparty/dxbc lsfg/thirdparty/dxbc
          for p in framegen/patches/*.patch; do
            echo "Applying $p"
            git -C lsfg apply --verbose "$GITHUB_WORKSPACE/$p"
          done
          (cd lsfg && ANDROID_ABI=arm64-v8a ANDROID_PLATFORM=android-28 bash ./scripts/build/android.sh Release)
          mkdir -p framegen-out
          cp lsfg/build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so framegen-out/liblsfg-vk.so
          file framegen-out/liblsfg-vk.so
          echo "lsfg-vk-android $(git -C lsfg rev-parse HEAD), NDK $ANDROID_NDK_VERSION, patches: $(cd framegen/patches && ls *.patch | tr '\n' ' ')" > framegen-out/BUILD-INFO.txt

      - name: Show layer
        run: |
          cat framegen-out/BUILD-INFO.txt
          sha256sum framegen-out/liblsfg-vk.so

      - uses: actions/upload-artifact@v4
        with:
          name: framegen-thor
          path: framegen-out/
          if-no-files-found: error

  build:
    needs: [turnip, framegen]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Download Turnip driver
        uses: actions/download-artifact@v4
        with:
          name: turnip-thor
          path: ${{ runner.temp }}/turnip

      - name: Bundle Turnip driver
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/turnip"
          cat > "$d/meta.json" <<'JSON'
          {"schemaVersion":1,"name":"thor-turnip-26.2.3","description":"Turnip (Mesa 26.2.3, shader cache on) as tested with the Thor Forever launcher","author":"Mesa","packageVersion":"1","vendor":"Mesa","driverVersion":"26.2.3","minApi":28,"libraryName":"libvulkan_freedreno.so"}
          JSON
          tar -C "$d" -cf - meta.json libvulkan_freedreno.so | zstd -19 -q -o app/src/main/assets/graphics_driver/adrenotools-thor-turnip-26.2.3.tzst
          ls -la app/src/main/assets/graphics_driver/

      - name: Download frame generation layer
        uses: actions/download-artifact@v4
        with:
          name: framegen-thor
          path: ${{ runner.temp }}/framegen

      - name: Bundle frame generation layer
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/framegen/BUILD-INFO.txt"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/framegen/liblsfg-vk.so" app/src/main/jniLibs/arm64-v8a/liblsfg-vk.so

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL \
            "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" \
            -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so
          test -s app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Load our signing key
        env:
          THOR_KEYSTORE_BASE64: ${{ secrets.THOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$THOR_KEYSTORE_BASE64" ]; then
            echo "$THOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thor.p12"
            echo "THOR_KEYSTORE_FILE=$RUNNER_TEMP/thor.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::THOR_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
          fi

      - name: Forever Companion decoder tests
        run: ./gradlew :companion-decoder:test

      - name: Build with Gradle
        env:
          THOR_KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PthorSetupTest=${{ inputs.setup_test_copy == true }} -PthorRelease=${{ inputs.release == true }}

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release == true && 'Thor-Forever' || (inputs.setup_test_copy == true && 'Thor-Setup-Test' || 'Bionic-Build') }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Only a draft: it stays private until the owner presses Publish on GitHub.
      - name: Draft GitHub release
        if: inputs.release == true && inputs.draft_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.draft_release_tag }}
          TARGET: ${{ inputs.draft_release_target != '' && inputs.draft_release_target || github.sha }}
        run: |
          apks=(app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -eq 1 ] || { echo "Expected one APK, found ${#apks[@]}"; exit 1; }
          cp "${apks[0]}" "Thor-Forever-$TAG.apk"
          # A draft with this tag already there gets the new APK and notes; a published release is never touched.
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "true" ]; then
            gh release upload "$TAG" "Thor-Forever-$TAG.apk" --clobber
            gh release edit "$TAG" --draft --prerelease --target "$TARGET" --notes-file docs/RELEASE-NOTES.md
          elif [ "$draft" = "none" ]; then
            gh release create "$TAG" "Thor-Forever-$TAG.apk" --draft --prerelease \
              --target "$TARGET" --title "Thor Forever $TAG (alpha)" --notes-file docs/RELEASE-NOTES.md
          else
            echo "::warning::Release $TAG is already published, so it was not changed. The APK is in the build's artifacts."
          fi

      # Pictures of the Forever Companion's tabs (CompanionScreensTest, filled with sample data)
      # and of the start screen (StartScreenShotsTest), so a change to their look can be seen
      # without the Thor. Never holds up the APK.
      - name: Companion screenshots
        continue-on-error: true
        run: ./gradlew testReleaseUnitTest --tests thor.companion.CompanionScreensTest --tests com.winlator.cmod.ui.start.StartScreenShotsTest -PcompanionScreens="$GITHUB_WORKSPACE/companion-screens"

      - name: Upload companion screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Companion-Screens-${{ github.run_number }}
          path: |
            companion-screens/
            app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn
